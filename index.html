:root{
--bg:#0e1014; --surface:#15181e; --surface2:#1c2028; --border:#2b313c;
--text:#e8eaee; --text2:#a1a9b6; --muted:#6f7885;
--accent:#5c9dff; --accent-bg:#12233f; --accent-border:#274c85;
--success:#4fd18b; --success-bg:#10261c; --danger:#f2777a;
--radius:10px;
--sans:'PlexAr',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:'PlexMo','PlexAr',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-text-size-adjust:100%;}
body{padding:16px 12px 40px; display:flex; justify-content:center;}
#card{width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;}
label{display:block; font-size:15px; color:var(--text2); margin-bottom:8px;}
input,button{font-family:inherit; color:var(--text);}
input{width:100%; height:44px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:0 12px; font-size:16px; outline:none;}
input:focus{border-color:var(--accent-border); box-shadow:0 0 0 2px rgba(92,157,255,.15);}
input[type=number]{font-family:var(--mono);}
button{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; font-size:14px; cursor:pointer;}
button:hover{border-color:var(--accent-border);}
button:active{transform:translateY(1px);}
.langbar{display:flex; justify-content:center; gap:8px; padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:24px;}
.langbar button{width:68px; height:38px; padding:0; font-size:15px;}
.on{background:var(--accent-bg); color:var(--accent); border-color:var(--accent-border);}
#basic,#house{color:var(--accent); font-weight:600; text-align:center; font-size:17px; padding:0 20px;}
#basic::-webkit-inner-spin-button,#house::-webkit-inner-spin-button{display:none; -webkit-appearance:none;}
.field{position:relative;}
.meas{position:absolute; visibility:hidden; white-space:pre; font-family:var(--mono); font-size:17px; font-weight:600;}
.sfx{position:absolute; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted); pointer-events:none;}
.note{font-size:14px; color:var(--muted); margin-top:8px;}
.note b{font-family:var(--mono); direction:ltr; color:var(--accent); font-weight:600; font-size:15px; white-space:nowrap;}
.head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.head span{font-size:16px; font-weight:600;}
.row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.nm{flex:1; min-width:0; font-size:15px;}
.pctwrap{position:relative; width:78px; flex:none;}
.pct{text-align:center; padding-inline-end:22px; font-size:16px;}
.pct::-webkit-inner-spin-button,.nospin::-webkit-inner-spin-button{display:none; -webkit-appearance:none;}
.pct,.nospin{-moz-appearance:textfield;}
.pctsign{position:absolute; inset-inline-end:8px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--muted); pointer-events:none;}
.arrows{display:flex; flex-direction:column; gap:2px; flex:none; width:26px;}
.w-fac{width:78px; flex:none;}
.w-arr{width:26px; flex:none;}
.w-val{width:124px; flex:none;}
.w-del{width:34px; flex:none;}
.otfac{text-align:center; color:var(--accent); font-weight:600;}
.arrows button{height:21px; width:26px; padding:0; line-height:1; display:flex; align-items:center; justify-content:center;}
.ic{width:11px; height:8px; display:block;}
.ic.x{width:14px; height:14px;}
.del{display:flex; align-items:center; justify-content:center;}
.val{width:124px; flex:none; font-size:15px; font-weight:600; font-family:var(--mono); direction:ltr; white-space:nowrap;}
.pos{color:var(--success);} .neg{color:var(--danger);}
.del{height:44px; width:34px; padding:0; flex:none; color:var(--text2);}
.cur{color:var(--muted); font-weight:400; font-size:.85em;}
.rs{width:.95em; height:.95em; display:inline-block; vertical-align:-0.12em; opacity:.85;}
.formula{background:var(--surface2); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.frow{display:flex; align-items:center; justify-content:center; gap:10px; font-size:15px; color:var(--text2); direction:ltr; flex-wrap:wrap;}
.chip{display:inline-flex; align-items:center; justify-content:center; width:116px; height:42px; flex:none; font-weight:600; color:var(--accent); background:var(--accent-bg); border:1px solid var(--accent-border); border-radius:var(--radius); font-family:var(--mono); font-size:16px; text-align:center; padding:0;}
input.chip{width:116px;}
.hr{margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
.hr small{font-size:14px; color:var(--muted);}
.hrv{font-size:20px; font-weight:600; font-family:var(--mono); margin-top:4px; direction:ltr; white-space:nowrap; overflow-x:auto;}
.cols{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); padding:0 2px 6px;}
.totrow{display:flex; justify-content:space-between; font-size:15px; padding:6px 0;}
.totrow .v{font-family:var(--mono); direction:ltr; white-space:nowrap;}
.netbox{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; background:var(--success-bg); border-radius:var(--radius); padding:14px 16px;}
.netbox span:first-child{font-size:16px; color:var(--success);}
.netbox .v{font-size:26px; font-weight:600; color:var(--success); font-family:var(--mono); direction:ltr; white-space:nowrap;}
.sec{margin-bottom:28px;}
.foot{text-align:center; margin-top:20px; padding-top:12px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); direction:ltr;}
.foot b{font-weight:600; letter-spacing:.05em; color:var(--text2);}
@media (max-width:520px){
  .row{flex-wrap:wrap; gap:6px;}
  .nm{flex:1 1 100%;}
  .val,.w-val{width:106px; font-size:13px;}
  .cur{font-size:.75em;}
  .frow{flex-wrap:nowrap; gap:6px;}
  .frow>.chip{flex:1 1 0; width:auto; min-width:0; font-size:15px;}
  .netbox .v{font-size:22px;}
  .pctwrap{width:70px;}
  .arrows,.arrows button,.w-arr{width:24px;}
  .del,.w-del{width:30px;}
  .w-fac{width:70px;}
  .w-val{width:96px;}
  .cols{gap:6px;}
  #card{padding:16px 12px;}
}
</style>
</head>

var RS='<svg class="rs" viewBox="0 0 1256 1256" fill="currentColor" role="img" aria-label="SAR"><path d="M0,0M750,1119 C730,1163,716,1211,711,1262 C711,1262,1136,1172,1136,1172 C1156,1127,1169,1079,1174,1028 C1174,1028,750,1119,750,1119Z M1136,901 C1136,901,1136,901,1136,901 C1156,857,1169,809,1174,758 C1174,758,843,828,843,828 C843,828,843,693,843,693 C843,693,1136,631,1136,631 C1156,587,1169,538,1174,488 C1174,488,843,558,843,558 C843,558,843,72,843,72 C793,100,748,138,711,183 C711,183,711,586,711,586 C711,586,579,614,579,614 C579,614,579,6,579,6 C528,34,483,72,447,117 C447,117,447,642,447,642 C447,642,151,705,151,705 C131,750,117,798,112,849 C112,849,447,777,447,777 C447,777,447,948,447,948 C447,948,88,1024,88,1024 C68,1068,55,1117,50,1167 C50,1167,425,1088,425,1088 C456,1081,482,1063,499,1038 C499,1038,568,936,568,936 C568,936,568,936,568,936 C575,926,579,913,579,899 C579,899,579,749,579,749 C579,749,711,721,711,721 C711,721,711,992,711,992 C711,992,1136,901,1136,901Z"/></svg>';
D.ar.cur=RS;
var MUL=1.5;
var DEF={basic:"",house:"",div:243.3333333333,
allow:[{k:"remote",n:null,p:14},{k:"transport",n:null,p:10},{k:"hazard",n:null,p:7}],
ots:[{h:0,m:1.5}],
deds:[{k:"gosi",n:null,p:9,b:"bh"},{k:"savings",n:null,p:10,b:"b"},{k:"saned",n:null,p:0.75,b:"bh"}]};
var lang='en', st=null;

var clone=function(o){return JSON.parse(JSON.stringify(o));};
var f2=function(x){return x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
var fp=function(x){return x.toFixed(2);};
var f10=function(x){var s=x.toFixed(10); if(s.indexOf('.')>-1){s=s.replace(/0+$/,'').replace(/\.$/,'');} return s;};
var num=function(v){return parseFloat(v)||0;};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var nameOf=function(o){return o.n!==null?o.n:D[lang].names[o.k];};
var money=function(s){return s+' <span class="cur">'+D[lang].cur+'</span>';};
var setM=function(id,s){var e=document.getElementById(id); if(e)e.innerHTML=money(s);};

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({st:st,lang:lang}));}catch(e){}
}
function load(){
  var j=null;
  try{j=localStorage.getItem(KEY);}catch(e){}
  if(j){try{var o=JSON.parse(j);
    if(o&&o.st&&o.st.allow&&o.st.deds&&o.st.ots){st=o.st; if(o.lang==='ar'||o.lang==='en')lang=o.lang;}
  }catch(e){}}
  if(!st)st=clone(DEF);
  st.ots.forEach(function(x){if(x.m===undefined||x.m===null)x.m=MUL;});
}

function moneyField(id,v,step,cur){
  return '<div class="field"><input type="number" id="'+id+'" value="'+esc(v)+'" step="'+step+'" inputmode="decimal" />'
       + '<span class="meas" id="m_'+id+'"></span><span class="sfx" id="s_'+id+'">'+cur+'</span></div>';
}
function pctField(id,v,step,t){
  return '<div class="pctwrap"><input type="number" class="pct" id="'+id+'" value="'+v+'" step="'+step+'" inputmode="decimal" /><span class="pctsign">%</span></div>'
       + '<div class="arrows"><button data-stp="'+id+'" data-s="'+step+'" aria-label="'+t.up+'">'+UP+'</button>'
       + '<button data-stp="'+id+'" data-s="-'+step+'" aria-label="'+t.dn+'">'+DN+'</button></div>';
}
function stepField(id,v,step,t,cls,style){
  return '<input type="number" class="nospin '+cls+'" id="'+id+'" value="'+v+'" step="'+step+'" min="0" inputmode="decimal" style="'+style+'" />'
       + '<div class="arrows"><button data-stp="'+id+'" data-s="'+step+'" aria-label="'+t.up+'">'+UP+'</button>'
       + '<button data-stp="'+id+'" data-s="-'+step+'" aria-label="'+t.dn+'">'+DN+'</button></div>';
}
function placeSuffix(id){
  var inp=document.getElementById(id), meas=document.getElementById('m_'+id), sfx=document.getElementById('s_'+id);
  if(!inp||!meas||!sfx)return;
  if(inp.value===''){sfx.style.display='none'; return;}
  sfx.style.display='';
  meas.textContent=inp.value;
  sfx.style.insetInlineStart=((inp.offsetWidth+meas.offsetWidth)/2+10)+'px';
}

function build(){
  var t=D[lang], rtl=(lang==='ar');
  var h='<div class="langbar" dir="ltr">'
      + '<button data-lang="en" class="'+(lang==='en'?'on':'')+'">EN</button>'
      + '<button data-lang="ar" class="'+(lang==='ar'?'on':'')+'">AR</button></div>';

  h+='<div class="sec"><label>'+t.basic+'</label>'+moneyField('basic',st.basic,10,t.cur)+'</div>';

  h+='<div class="sec"><label>'+t.house+'</label>'+moneyField('house',st.house,1000,t.cur)
   + '<div class="note">'+t.per+' = <b id="houseM">0</b></div>'
   + '<div class="note" style="margin-top:4px;">'+t.Total+' = <b id="baseSum">0</b></div></div>';

  h+='<div class="head"><span>'+t.allowances+'</span><button id="addAllow">+ '+t.addAllow+'</button></div>'
   + '<div id="allowList" class="sec"></div>';

  h+='<div class="head"><span>'+t.overtime+'</span><button id="addOt">+ '+t.add+'</button></div>';

  h+='<div class="formula"><div class="frow"><span id="basicEcho" class="chip">0</span><span>&divide;</span>'
   + '<input type="text" inputmode="decimal" id="divBox" class="chip" value="'+fp(st.div)+'" />'
   + '<span>&times;</span><span class="chip">'+MUL+'</span></div>'
   + '<div class="hr"><small>'+t.hourly+'</small><div class="hrv" id="hourRateFull" style="text-align:'+(rtl?'right':'left')+'">0</div></div></div>';

  h+='<div class="cols"><span class="w-fac" style="text-align:center">'+t.factor+'</span>'
   + '<span class="w-arr"></span>'
   + '<span style="flex:1;min-width:50px;text-align:center">'+t.hours+'</span>'
   + '<span class="w-arr"></span>'
   + '<span class="w-val" style="text-align:'+(rtl?'left':'right')+'">'+t.amount+'</span>'
   + '<span class="w-del"></span></div>';

  h+='<div id="otList"></div><div class="totrow sec" style="padding-top:6px"><span style="color:var(--text2)">'+t.totalOt+'</span><span class="v pos" id="otTotal">0.00</span></div>';

  h+='<div class="head"><span>'+t.deductions+'</span><button id="addDed">+ '+t.addDed+'</button></div>'
   + '<div id="dedList" class="sec"></div>';

  h+='<div style="border-top:1px solid var(--border); padding-top:16px;">'
   + '<div class="totrow"><span style="color:var(--text2)">'+t.gross+'</span><span class="v" id="tGross">0.00</span></div>'
   + '<div class="totrow"><span class="neg">'+t.totalDed+'</span><span class="v neg" id="tDed">0.00</span></div>'
   + '<div class="netbox"><span>'+t.net+'</span><span class="v" id="tNet">0.00</span></div></div>';

  h+='<div style="text-align:center; margin-top:20px;"><button id="resetBtn">'+t.reset+'</button></div>';
  h+='<div class="foot">Powered by <b>ALDOOSAA</b></div>';

  var c=document.getElementById('card');
  c.setAttribute('dir',rtl?'rtl':'ltr');
  document.documentElement.setAttribute('lang',lang);
  c.innerHTML=h;
  buildLists();
}

function buildLists(){
  var t=D[lang], end=(lang==='ar')?'left':'right';
  var h='';
  st.allow.forEach(function(a,i){
    h+='<div class="row"><input class="nm" id="an'+i+'" value="'+esc(nameOf(a))+'" />'
     + pctField('ap'+i,a.p,1,t)
     + '<span class="val pos" id="av'+i+'" style="text-align:'+end+'">0.00</span>'
     + '<button class="del" data-del="a" data-i="'+i+'" aria-label="'+t.rm+'">'+XX+'</button></div>';
  });
  document.getElementById('allowList').innerHTML=h;

  h='';
  st.ots.forEach(function(o,i){
    h+='<div class="row">'
     + stepField('om'+i,o.m,0.5,t,'w-fac otfac','')
     + stepField('oh'+i,o.h,1,t,'','flex:1;min-width:50px;text-align:center')
     + '<span class="val pos" id="ov'+i+'" style="text-align:'+end+'">0.00</span>'
     + '<button class="del" data-del="o" data-i="'+i+'" aria-label="'+t.rm+'">'+XX+'</button></div>';
  });
  document.getElementById('otList').innerHTML=h;

  h='';
  st.deds.forEach(function(d,i){
    h+='<div class="row"><input class="nm" id="dn'+i+'" value="'+esc(nameOf(d))+'" />'
     + pctField('dp'+i,d.p,0.25,t)
     + '<span class="val neg" id="dv'+i+'" style="text-align:'+end+'">0.00</span>'
     + '<button class="del" data-del="d" data-i="'+i+'" aria-label="'+t.rm+'">'+XX+'</button></div>';
  });
  document.getElementById('dedList').innerHTML=h;
  calc();
}

function calc(){
  var basic=num(st.basic), houseM=num(st.house)/12;
  setM('houseM',fp(houseM));
  setM('baseSum',f2(basic+houseM));
  document.getElementById('basicEcho').textContent=basic;
  var base=st.div?basic/st.div:0;
  setM('hourRateFull',f10(base*MUL));

  var aT=0;
  st.allow.forEach(function(a,i){var v=basic*a.p/100; aT+=v; setM('av'+i,f2(v));});
  var oT=0;
  st.ots.forEach(function(o,i){var v=base*num(o.m)*num(o.h); oT+=v; setM('ov'+i,f2(v));});
  setM('otTotal',f2(oT));
  var dT=0;
  st.deds.forEach(function(d,i){var b=(d.b==='bh')?(basic+houseM):basic; var v=b*d.p/100; dT+=v; setM('dv'+i,f2(v));});

  var gross=basic+houseM+aT+oT;
  setM('tGross',f2(gross));
  setM('tDed',f2(dT));
  setM('tNet',f2(gross-dT));
  placeSuffix('basic'); placeSuffix('house');
}

function sync(el){
  var id=el.id||'', n=parseInt(id.replace(/\D/g,''),10);
  if(id==='basic')st.basic=el.value;
  else if(id==='house')st.house=el.value;
  else if(id==='divBox'){var d=parseFloat(el.value); if(!isNaN(d)&&d>0)st.div=d;}
  else if(id.indexOf('an')===0)st.allow[n].n=el.value;
  else if(id.indexOf('ap')===0)st.allow[n].p=num(el.value);
  else if(id.indexOf('om')===0)st.ots[n].m=el.value;
  else if(id.indexOf('oh')===0)st.ots[n].h=el.value;
  else if(id.indexOf('dn')===0)st.deds[n].n=el.value;
  else if(id.indexOf('dp')===0)st.deds[n].p=num(el.value);
  calc(); save();
}

function doReset(){
  st.basic=''; st.house='';
  st.allow.forEach(function(a){a.p=0;});
  build(); save();
  var r=document.getElementById('resetBtn');
  if(r){r.textContent=D[lang].done;
    setTimeout(function(){var q=document.getElementById('resetBtn'); if(q)q.textContent=D[lang].reset;},1500);}
}

document.addEventListener('input',function(e){if(e.target.tagName==='INPUT')sync(e.target);});
document.addEventListener('focusin',function(e){if(e.target.id==='divBox')e.target.value=f10(st.div);});
document.addEventListener('focusout',function(e){if(e.target.id==='divBox')e.target.value=fp(st.div);});
window.addEventListener('resize',function(){placeSuffix('basic'); placeSuffix('house');});

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  var L=b.getAttribute('data-lang');
  if(L){if(L!==lang){lang=L; build(); save();} return;}
  var sid=b.getAttribute('data-stp');
  if(sid){var el=document.getElementById(sid); if(!el)return;
    var s=parseFloat(b.getAttribute('data-s'));
    var nv=(parseFloat(el.value)||0)+s; if(nv<0)nv=0;
    el.value=parseFloat(nv.toFixed(4)); sync(el); return;}
  if(b.id==='resetBtn'){doReset(); return;}
  var d=b.getAttribute('data-del'), i=parseInt(b.getAttribute('data-i'),10);
  if(d==='a')st.allow.splice(i,1);
  else if(d==='o')st.ots.splice(i,1);
  else if(d==='d')st.deds.splice(i,1);
  else if(b.id==='addAllow')st.allow.push({k:null,n:D[lang].newA,p:0});
  else if(b.id==='addOt')st.ots.push({h:0,m:MUL});
  else if(b.id==='addDed')st.deds.push({k:null,n:D[lang].newD,p:0,b:'b'});
  else return;
  buildLists(); save();
});

load(); build();
})();
</script>
</body>
</html>
